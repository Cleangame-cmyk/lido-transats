<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cave &amp; Bar Lido</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap">
<style>
:root{
  --bg:#f6f4ed; --surface:#fffdf8; --surface2:#efece2; --ink:#26302a; --muted:#67736b;
  --line:#e2dfd3; --accent:#42594a; --accent-soft:#e4eae5; --gold:#a8854e; --gold-soft:#f1e8d8;
  --warn-ink:#7a5f10; --warn-bg:#f6ecc6; --urgent-ink:#8c2f23; --urgent-bg:#f6ddd7;
  --ok-ink:#2d5f3a; --ok-bg:#dceadf; --chip-ink:#33443a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161b17; --surface:#1e2520; --surface2:#242c26; --ink:#e7e5da; --muted:#96a29a;
    --line:#2e3831; --accent:#8fa896; --accent-soft:#28352d; --gold:#c2a06e; --gold-soft:#33301f;
    --warn-ink:#e3c96f; --warn-bg:#37301a; --urgent-ink:#e59a8c; --urgent-bg:#3b241f;
    --ok-ink:#9ccba8; --ok-bg:#22352a; --chip-ink:#c6d2c9;
  }
}
:root[data-theme="dark"]{
  --bg:#161b17; --surface:#1e2520; --surface2:#242c26; --ink:#e7e5da; --muted:#96a29a;
  --line:#2e3831; --accent:#8fa896; --accent-soft:#28352d; --gold:#c2a06e; --gold-soft:#33301f;
  --warn-ink:#e3c96f; --warn-bg:#37301a; --urgent-ink:#e59a8c; --urgent-bg:#3b241f;
  --ok-ink:#9ccba8; --ok-bg:#22352a; --chip-ink:#c6d2c9;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding-bottom:90px}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px 0}
.hrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:26px;margin:0;color:var(--accent);letter-spacing:.3px}
h1 small{font-family:inherit;font-size:15px;color:var(--gold)}
.who{margin-left:auto;display:flex;gap:6px;align-items:center}
.who span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.who button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.who button.on{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
#q{width:100%;margin:10px 0;padding:11px 14px;font-size:16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
#q:focus{outline:none;border-color:var(--accent)}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px 10px 0 0;border-bottom:none;padding:8px 13px;font-size:13.5px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}
main{max-width:780px;margin:0 auto;padding:12px 14px}
.grouphead{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin:18px 2px 6px;font-weight:700}
.grouphead:first-child{margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
.row{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:none}
.row:active{background:var(--surface2)}
.r1{display:flex;gap:8px;align-items:baseline}
.pname{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.price{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);text-align:right;max-width:52%;flex:0 0 auto}
.price.miss{color:var(--warn-ink);font-weight:600;font-size:13px}
.r2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px;font-size:12.5px;color:var(--muted)}
.chip{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:600;background:var(--accent-soft);color:var(--chip-ink);letter-spacing:.02em}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.warn{background:var(--warn-bg);color:var(--warn-ink)}
.chip.urgent{background:var(--urgent-bg);color:var(--urgent-ink)}
.chip.ok{background:var(--ok-bg);color:var(--ok-ink)}
.detail{display:none;background:var(--surface2);padding:10px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
.detail.open{display:block}
.detail .src{color:var(--muted);font-size:12px;margin-top:6px}
.notes{margin-top:8px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;margin-top:5px;font-size:13px}
.note b{color:var(--gold);font-size:11.5px}
.noteform{display:flex;gap:6px;margin-top:8px}
.noteform input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:14px}
.noteform button{border:none;background:var(--accent);color:var(--bg);border-radius:8px;padding:0 14px;font-weight:600;cursor:pointer}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.fcard h3{margin:0 0 4px;font-size:16px;color:var(--accent);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.fcard .fline{font-size:13.5px;margin-top:5px}
.fcard .fline b{color:var(--gold);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;display:block}
.fcard .vig{color:var(--urgent-ink);}
.plathead{padding:9px 12px;background:var(--surface2);font-weight:700;display:flex;justify-content:space-between;cursor:pointer;border-bottom:1px solid var(--line)}
.plathead .cnt{color:var(--muted);font-weight:400;font-size:12.5px}
.platbody{display:none}
.platbody.open{display:block}
.mq{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.mq:last-child{border-bottom:none}
.mq.done .txt{text-decoration:line-through;color:var(--muted)}
.fab{position:fixed;right:16px;bottom:16px;z-index:30;border:none;background:var(--accent);color:var(--bg);border-radius:999px;padding:13px 20px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);width:min(440px,92vw);padding:18px}
dialog::backdrop{background:rgba(20,25,21,.55)}
dialog h2{margin:0 0 12px;font-size:18px;color:var(--accent)}
dialog label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 3px}
dialog input,dialog select,dialog textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px}
.dlgbtns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.dlgbtns button{border-radius:9px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.dlgbtns .go{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.banner{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px;display:none}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#lock .box{width:min(360px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 22px;text-align:center}
#lock h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:28px;margin:0 0 4px;color:var(--accent)}
#lock .sub{color:var(--gold);font-size:13px;margin-bottom:18px}
#lock p{font-size:14px;color:var(--muted);margin:0 0 14px}
#lock input{width:100%;padding:11px 12px;font-size:16px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-bottom:10px;text-align:center}
#lock button{width:100%;border:none;background:var(--accent);color:var(--bg);border-radius:10px;padding:12px;font-size:15px;font-weight:700;cursor:pointer}
#lock .err{color:var(--urgent-ink);font-size:13px;min-height:18px;margin-top:8px}
.legend{font-size:12px;color:var(--muted);margin:4px 2px 12px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
button:focus-visible,input:focus-visible,.row:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="lock"><div class="box">
  <h2>Cave &amp; Bar</h2><div class="sub">Le Lido · bar</div>
  <p id="lockmsg">Connexion à la base partagée…</p>
  <div id="lockform" hidden>
    <input id="pw1" type="password" placeholder="Mot de passe équipe" autocomplete="current-password">
    <button id="pwgo">Entrer</button>
    <div class="err" id="pwerr"></div>
  </div>
</div></div>
<header>
  <div class="hrow">
    <h1>Cave &amp; Bar <small>Le Lido</small></h1>
    <div class="who"><span>Je suis</span><button id="wj">Julien</button><button id="wa">Dmytro</button></div>
  </div>
  <input id="q" type="search" placeholder="Compare : gin, purée, prosecco, ginger, spritz…" autocomplete="off">
  <nav>
    <button data-tab="search" class="on">🔎 Tout</button>
    <button data-tab="carte">🍸 Cocktails</button>
    <button data-tab="fours">🚚 Fournisseurs</button>
    <button data-tab="todo">❓ À trouver</button>
    <button data-tab="ajouts">✍️ Nos ajouts</button>
  </nav>
</header>
<main>
  <div class="banner" id="banner">Base partagée indisponible — consultation seule, les ajouts ne seront pas enregistrés.</div>
  <div id="view"></div>
</main>
<button class="fab" id="fab">＋ Ajouter une info</button>
<dialog id="dlg">
  <h2>Ajouter une info récoltée</h2>
  <label>Produit / sujet *</label><input id="f_prod" placeholder="ex : Huile de truffe">
  <label>Fournisseur</label><select id="f_four"></select>
  <label>Réf</label><input id="f_ref" placeholder="réf catalogue si connue">
  <label>Prix</label><input id="f_prix" placeholder="ex : 12,50 €/kg">
  <label>Conditionnement</label><input id="f_cond" placeholder="ex : bidon 5 L">
  <label>Note (vu où, contact, condition…)</label><textarea id="f_note" rows="2"></textarea>
  <label>Statut</label><select id="f_stat"><option value="est">🟡 À confirmer (estimé / oral)</option><option value="conf">✅ Confirmé (facture / tarif écrit)</option></select>
  <div class="dlgbtns"><button id="f_cancel">Annuler</button><button class="go" id="f_save">Enregistrer</button></div>
</dialog>

function notesFor(id){ return notes.filter(n=>n.rowId===id); }
function noteHtml(id){

}
/* ---------- rows ---------- */
function rowHtml(o){
  const price=o.prix?'<span class="price">'+esc(o.prix)+'</span>':'<span class="price miss">prix ?</span>';
  const est=isEst(o.prix)||isEst(o.note)?' <span class="chip warn">à confirmer</span>':'';
  const nc=notesFor(o.id).length?' <span class="chip gold">📝 '+notesFor(o.id).length+'</span>':'';
  return '<div class="row" tabindex="0" onclick="tg(this)"><div class="r1"><span class="pname">'+esc(o.produit)+'</span>'+price+'</div>'+
  '<div class="r2">'+fchip(o.f)+(o.ref?'<span>réf '+esc(o.ref)+'</span>':'')+(o.cond?'<span>'+esc(o.cond)+'</span>':'')+est+nc+'</div></div>'+

}

function vSearch(q){
  if(!q){
    const nprix=SEED.catalog.filter(c=>!c.prix).length;
    let h='<div class="statgrid">'+
    '<div class="stat"><b>'+(SEED.catalog.length+SEED.casibel.length+(SEED.gineys||[]).length+ajouts.length)+'</b><span>prix & réfs en base</span></div>'+
    '<div class="stat"><b>'+SEED.fournisseurs.length+'</b><span>fournisseurs</span></div>'+
    '<div class="stat"><b>'+nprix+'</b><span>prix « ? » au tarif MPB</span></div>'+
    '<div class="stat"><b>'+SEED.manques.filter(m=>!isDone(m.id)).length+'</b><span>questions ouvertes</span></div></div>';
    h+='<div class="legend">🟡 à confirmer = jamais un chiffre inventé : tout prix affiché vient d\'un tarif, d\'une facture ou d\'un portail (source dans le détail de chaque ligne).</div>';
    h+='<div class="grouphead">🔥 Urgent</div><div class="card">'+SEED.manques.filter(m=>m.prio==='URGENT').map(mqHtml).join('')+'</div>';
    h+='<div class="grouphead">⚖️ Comparatifs déjà tranchés</div><div class="card">'+SEED.comparatifs.map(compHtml).join('')+'</div>';
    return h;
  }
  const toks=norm(q).split(/\s+/).filter(Boolean);
  const hit=f=>{const hay=norm(f.join(' '));const hay2=hay.replace(/[^a-z0-9]/g,'');return toks.every(t=>hay.includes(t)||hay2.includes(t.replace(/[^a-z0-9]/g,'')));};
  let h='';
  // 1. verdicts déjà tranchés
  const comps=SEED.comparatifs.filter(c=>hit([c.produit,c.note,c.mericq,c.casibel]));
  if(comps.length)h+='<div class="grouphead">⚖️ Déjà tranché</div><div class="card">'+comps.map(compHtml).join('')+'</div>';
  // 2. comparateur : tous les prix, groupés par fournisseur
  const rows=allPriceRows().filter(o=>hit([o.produit,o.ref,o.note,o.cond,o.src||'']));
  const byF={};
  rows.forEach(o=>{const k=o.f||'Fournisseur ?';(byF[k]=byF[k]||[]).push(o);});
  const keys=Object.keys(byF).sort((a,b)=>byF[b].length-byF[a].length);
  keys.forEach(k=>{h+='<div class="grouphead">💶 '+esc(k)+' — '+byF[k].length+' prix</div><div class="card">'+byF[k].slice(0,25).map(rowHtml).join('')+'</div>';});
  if(keys.length>1)h+='<div class="legend">⚠ Compare à l\'unité (kg / litre / pièce) — les conditionnements diffèrent d\'un fournisseur à l\'autre.</div>';
  // 3. le reste
  const ca=SEED.carte.filter(o=>hit([o.ing,o.plat,o.f,o.ref,o.note]));
  if(ca.length)h+='<div class="grouphead">🍽 Sur la carte</div><div class="card">'+ca.slice(0,40).map(carteRowHtml).join('')+'</div>';
  const inv=SEED.inventaire.filter(o=>hit([o.art,o.fam,o.f,o.statut]));
  if(inv.length)h+='<div class="grouphead">📦 Inventaire 04/09</div><div class="card">'+inv.slice(0,30).map(invRowHtml).join('')+'</div>';
  const fo=SEED.fournisseurs.filter(o=>hit([o.nom,o.produits,o.commande,o.contacts,o.vigilance,o.livraison]));
  if(fo.length)h+='<div class="grouphead">🚚 Fournisseurs</div>'+fo.map(fcardHtml).join('');
  const mq=SEED.manques.filter(o=>hit([o.txt]));
  if(mq.length)h+='<div class="grouphead">❓ À trouver</div><div class="card">'+mq.map(mqHtml).join('')+'</div>';
  if(!h)return '<div class="empty">Rien trouvé pour « '+esc(q)+' » chez aucun fournisseur.<br>Une info à ajouter ? Bouton ＋ en bas à droite.</div>';
  return h;
}
function fcardHtml(f){
  return '<div class="fcard"><h3>'+esc(f.nom)+'</h3>'+
  '<div class="fline"><b>Produits & prix repères</b>'+esc(f.produits)+'</div>'+
  (f.commande?'<div class="fline"><b>Commander</b>'+esc(f.commande)+'</div>':'')+
  (f.livraison?'<div class="fline"><b>Livraisons</b>'+esc(f.livraison)+'</div>':'')+
  (f.contacts?'<div class="fline"><b>Contacts</b>'+esc(f.contacts)+'</div>':'')+
  (f.rythme&&!f.livraison?'<div class="fline"><b>Rythme</b>'+esc(f.rythme)+'</div>':'')+
  (f.vigilance?'<div class="fline vig"><b>Vigilance</b>'+esc(f.vigilance)+'</div>':'')+
  noteHtml('f-'+f.code)+'</div>';
}
function isDone(id){ return notes.some(n=>n.rowId===id&&n.done); }
function mqHtml(m){
  const done=isDone(m.id);
  const pr=m.prio==='URGENT'?'<span class="chip urgent">URGENT</span>':(m.prio==='HAUTE'?'<span class="chip gold">haute</span>':'');
  return '<div class="mq'+(done?' done':'')+'" tabindex="0" onclick="tg(this)"><span>'+(done?'✅':'⬜️')+'</span><div style="flex:1"><span class="txt">'+esc(m.txt)+'</span> '+pr+'</div></div>'+
  '<div class="detail">'+(done?'':'<button class="fab" style="position:static;box-shadow:none;padding:8px 14px;font-size:13px" onclick="event.stopPropagation();markDone(\''+m.id+'\')">✅ C\'est réglé</button>')+noteHtml(m.id)+'</div>';
}
function vCarte(){
  const secs={};
  SEED.carte.forEach(o=>{(secs[o.sec]=secs[o.sec]||{});(secs[o.sec][o.plat]=secs[o.sec][o.plat]||[]).push(o);});
  let h='<div class="legend">Touche un cocktail : chaque ligne = ingrédient → dose → coût. L’en-tête donne PV TTC, coût matière total et CM % (calculé sur PV HT, TVA 20 % partout). 🟡 = prix estimé à confirmer.</div>';
  for(const s in secs){
    h+='<div class="grouphead">'+esc(s)+'</div><div class="card">';
    for(const p in secs[s]){
      const items=secs[s][p]; const miss=items.filter(i=>!i.prix).length;
      h+='<div class="plathead" onclick="this.nextElementSibling.classList.toggle(\'open\')">'+esc(p)+'<span class="cnt">'+items.length+' ingrédients'+(miss?' · '+miss+' prix ?':'')+'</span></div>'+
      '<div class="platbody">'+items.map(carteRowHtml).join('')+'</div>';
    }
    h+='</div>';
  }
  return h;
}
function vFours(){ return SEED.fournisseurs.map(fcardHtml).join(''); }
function compHtml(c){
  return '<div class="row" tabindex="0" onclick="tg(this)"><div class="r1"><span class="pname">'+esc(c.produit)+'</span><span class="chip gold">'+esc(c.verdict)+'</span></div></div>'+
  '<div class="detail">'+(c.mericq&&c.mericq!=='—'?'Mericq : '+esc(c.mericq)+'<br>':'')+(c.casibel&&c.casibel!=='—'?'Casibel : '+esc(c.casibel)+'<br>':'')+(c.note?'💡 '+esc(c.note):'')+'<div class="src">Comparatif vérifié (tarifs/factures)</div></div>';
}
function allPriceRows(){
  const out=[];
  SEED.catalog.forEach(o=>out.push(o));
  SEED.casibel.forEach(o=>out.push(o));
  (SEED.gineys||[]).forEach(o=>out.push(o));
  ajouts.forEach(o=>out.push(Object.assign({},o,{src:'✍️ Ajouté par '+(o.auteur||'?')+' le '+(o.date||'?')+(o.statut==='conf'?' (confirmé)':' (à confirmer)')})));
  SEED.carte.forEach(o=>{ if(o.prix) out.push({id:o.id,produit:o.ing+' ('+o.plat+')',ref:o.ref,prix:o.prix,cond:'',note:o.note,f:o.f,src:'Mapping carte'}); });
  return out;
}
function vTodo(){
  const open=SEED.manques.filter(m=>!isDone(m.id)), done=SEED.manques.filter(m=>isDone(m.id));
  let h='<div class="legend">Les questions ouvertes du module bar (responsable : Dmytro). Touche une ligne pour la détailler, noter une réponse ou la clore.</div>';
  h+='<div class="card">'+open.map(mqHtml).join('')+'</div>';
  if(done.length)h+='<div class="grouphead">✅ Réglées</div><div class="card">'+done.map(mqHtml).join('')+'</div>';
  return h;
}
function vAjouts(){
  if(!ajouts.length)return '<div class="empty">Aucun ajout pour l\'instant.<br>Tout ce que Dmytro ou toi récoltez (prix, contact, fournisseur) se met ici avec le bouton ＋ — et l\'autre le voit aussitôt.</div>';
  return '<div class="legend">Les infos récoltées par Dmytro et toi, visibles des deux, les plus récentes en premier.</div><div class="card">'+ajouts.map(ajoutRowHtml).join('')+'</div>';
}
function render(){
  const q=$('#q').value.trim();
  const v=$('#view');
  if(q){v.innerHTML=vSearch(q);return;}
  v.innerHTML={search:()=>vSearch(''),carte:vCarte,fours:vFours,todo:vTodo,ajouts:vAjouts}[tab]();
}
/* ---------- db ---------- */
function today(){const d=new Date();return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');}
async function saveNote(id){
  const inp=document.getElementById('nf-'+id); const t=(inp&&inp.value.trim())||''; if(!t)return;
  if(!fdb){alert('Base partagée indisponible — note non enregistrée.');return;}
  try{await fdb.child('notes').push({rowId:id,text:t,auteur:who||'?',date:today(),ts:Date.now()});}
  catch(e){alert('Enregistrement impossible ('+(e.code||'erreur')+'). Réessaie.');}
}
window.saveNote=saveNote;
window.markDone=async id=>{
  if(!fdb){alert('Base partagée indisponible.');return;}
  try{await fdb.child('notes').push({rowId:id,text:'Réglé',done:true,auteur:who||'?',date:today(),ts:Date.now()});}
  catch(e){alert('Enregistrement impossible.');}
};
async function saveAjout(){
  const prod=$('#f_prod').value.trim(); if(!prod){$('#f_prod').focus();return;}
  if(!fdb){alert('Base partagée indisponible — ajout non enregistré.');return;}
  const o={produit:prod,f:$('#f_four').value,ref:$('#f_ref').value.trim(),prix:$('#f_prix').value.trim(),cond:$('#f_cond').value.trim(),note:$('#f_note').value.trim(),statut:$('#f_stat').value,auteur:who||'?',date:today(),ts:Date.now()};
  try{await fdb.child('ajouts').push(o); $('#dlg').close();
    ['f_prod','f_ref','f_prix','f_cond','f_note'].forEach(i=>$('#'+i).value='');
  }catch(e){alert('Enregistrement impossible ('+(e.code||'erreur')+'). Réessaie.');}
}
/* ---------- boot ---------- */
function setWho(w){who=w;try{localStorage.setItem('cb_who',w);}catch(e){}
  $('#wj').classList.toggle('on',w==='Julien');$('#wa').classList.toggle('on',w==='Dmytro');}
$('#wj').onclick=()=>setWho('Julien'); $('#wa').onclick=()=>setWho('Dmytro'); if(who)setWho(who);
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$('#q').value='';
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render();});
let deb; $('#q').addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(render,150);});
$('#fab').onclick=()=>{const s=$('#f_four');s.innerHTML='<option value="">— je ne sais pas —</option>'+FCODES.map(c=>'<option>'+c+'</option>').join('')+'<option>AUTRE</option>';$('#dlg').showModal();};
$('#f_cancel').onclick=()=>$('#dlg').close();
$('#f_save').onclick=saveAjout;
render();
let fdb=null;
function startSubs(){
  fdb.child('ajouts').on('value',s=>{const v=s.val()||{};ajouts=Object.keys(v).map(k=>Object.assign({id:'a-'+k},v[k])).sort((a,b)=>(b.ts||0)-(a.ts||0));render();});
  fdb.child('notes').on('value',s=>{const v=s.val()||{};notes=Object.keys(v).map(k=>v[k]).sort((a,b)=>(a.ts||0)-(b.ts||0));render();});
}
