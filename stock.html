<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Lido</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap">
<style>
:root{
  --bg:#f6f4ed; --surface:#fffdf8; --surface2:#efece2; --ink:#26302a; --muted:#67736b;
  --line:#e2dfd3; --accent:#42594a; --accent-soft:#e4eae5; --gold:#a8854e; --gold-soft:#f1e8d8;
  --warn-ink:#7a5f10; --warn-bg:#f6ecc6; --urgent-ink:#8c2f23; --urgent-bg:#f6ddd7;
  --ok-ink:#2d5f3a; --ok-bg:#dceadf; --chip-ink:#33443a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161b17; --surface:#1e2520; --surface2:#242c26; --ink:#e7e5da; --muted:#96a29a;
    --line:#2e3831; --accent:#8fa896; --accent-soft:#28352d; --gold:#c2a06e; --gold-soft:#33301f;
    --warn-ink:#e3c96f; --warn-bg:#37301a; --urgent-ink:#e59a8c; --urgent-bg:#3b241f;
    --ok-ink:#9ccba8; --ok-bg:#22352a; --chip-ink:#c6d2c9;
  }
}
:root[data-theme="dark"]{
  --bg:#161b17; --surface:#1e2520; --surface2:#242c26; --ink:#e7e5da; --muted:#96a29a;
  --line:#2e3831; --accent:#8fa896; --accent-soft:#28352d; --gold:#c2a06e; --gold-soft:#33301f;
  --warn-ink:#e3c96f; --warn-bg:#37301a; --urgent-ink:#e59a8c; --urgent-bg:#3b241f;
  --ok-ink:#9ccba8; --ok-bg:#22352a; --chip-ink:#c6d2c9;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding-bottom:90px}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px 0}
.hrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:26px;margin:0;color:var(--accent);letter-spacing:.3px}
h1 small{font-family:inherit;font-size:15px;color:var(--gold)}
.who{margin-left:auto;display:flex;gap:6px;align-items:center}
.who span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.who button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.who button.on{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
#q{width:100%;margin:10px 0;padding:11px 14px;font-size:16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
#q:focus{outline:none;border-color:var(--accent)}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px 10px 0 0;border-bottom:none;padding:8px 13px;font-size:13.5px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}
main{max-width:780px;margin:0 auto;padding:12px 14px}
.grouphead{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);margin:18px 2px 6px;font-weight:700}
.grouphead:first-child{margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
.row{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:none}
.row:active{background:var(--surface2)}
.r1{display:flex;gap:8px;align-items:baseline}
.pname{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.price{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);text-align:right;max-width:52%;flex:0 0 auto}
.price.miss{color:var(--warn-ink);font-weight:600;font-size:13px}
.r2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px;font-size:12.5px;color:var(--muted)}
.chip{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:600;background:var(--accent-soft);color:var(--chip-ink);letter-spacing:.02em}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.warn{background:var(--warn-bg);color:var(--warn-ink)}
.chip.urgent{background:var(--urgent-bg);color:var(--urgent-ink)}
.chip.ok{background:var(--ok-bg);color:var(--ok-ink)}
.detail{display:none;background:var(--surface2);padding:10px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
.detail.open{display:block}
.detail .src{color:var(--muted);font-size:12px;margin-top:6px}
.notes{margin-top:8px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;margin-top:5px;font-size:13px}
.note b{color:var(--gold);font-size:11.5px}
.noteform{display:flex;gap:6px;margin-top:8px}
.noteform input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:14px}
.noteform button{border:none;background:var(--accent);color:var(--bg);border-radius:8px;padding:0 14px;font-weight:600;cursor:pointer}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.fcard h3{margin:0 0 4px;font-size:16px;color:var(--accent);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.fcard .fline{font-size:13.5px;margin-top:5px}
.fcard .fline b{color:var(--gold);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;display:block}
.fcard .vig{color:var(--urgent-ink);}
.plathead{padding:9px 12px;background:var(--surface2);font-weight:700;display:flex;justify-content:space-between;cursor:pointer;border-bottom:1px solid var(--line)}
.plathead .cnt{color:var(--muted);font-weight:400;font-size:12.5px}
.platbody{display:none}
.platbody.open{display:block}
.mq{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.mq:last-child{border-bottom:none}
.mq.done .txt{text-decoration:line-through;color:var(--muted)}
.fab{position:fixed;right:16px;bottom:16px;z-index:30;border:none;background:var(--accent);color:var(--bg);border-radius:999px;padding:13px 20px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);width:min(440px,92vw);padding:18px}
dialog::backdrop{background:rgba(20,25,21,.55)}
dialog h2{margin:0 0 12px;font-size:18px;color:var(--accent)}
dialog label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 3px}
dialog input,dialog select,dialog textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:15px}
.dlgbtns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.dlgbtns button{border-radius:9px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.dlgbtns .go{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.banner{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px;display:none}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#lock .box{width:min(360px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 22px;text-align:center}
#lock h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:28px;margin:0 0 4px;color:var(--accent)}
#lock .sub{color:var(--gold);font-size:13px;margin-bottom:18px}
#lock p{font-size:14px;color:var(--muted);margin:0 0 14px}
#lock input{width:100%;padding:11px 12px;font-size:16px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-bottom:10px;text-align:center}
#lock button{width:100%;border:none;background:var(--accent);color:var(--bg);border-radius:10px;padding:12px;font-size:15px;font-weight:700;cursor:pointer}
#lock .err{color:var(--urgent-ink);font-size:13px;min-height:18px;margin-top:8px}
.legend{font-size:12px;color:var(--muted);margin:4px 2px 12px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
button:focus-visible,input:focus-visible,.row:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.qty{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;flex:0 0 auto}
.qty.ok{color:var(--ok-ink)}.qty.warn{color:var(--warn-ink)}.qty.bad{color:var(--urgent-ink)}
.actbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.actbtns button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 11px;font-size:13px;cursor:pointer;font-weight:600}
.mvrow{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13.5px;display:flex;gap:8px;align-items:flex-start}
.mvrow:last-child{border-bottom:none}
.mvrow.rep{opacity:.55}
.mvrow .repbtn{margin-left:auto;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:7px;padding:3px 9px;font-size:11.5px;cursor:pointer;flex:0 0 auto}
.catbar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.catbar button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;white-space:nowrap}
.catbar button.on{background:var(--gold);border-color:var(--gold);color:var(--bg);font-weight:700}
.catbar button b{font-weight:400;font-size:11px;opacity:.75;margin-left:3px}
</style>
</head>

<div id="lock"><div class="box">
  <h2>Stock</h2><div class="sub">Le Lido · bar &amp; cuisine</div>
  <p id="lockmsg">Connexion à la base partagée…</p>
  <div id="lockform" hidden>
    <input id="pw1" type="password" placeholder="Mot de passe équipe" autocomplete="current-password">
    <button id="pwgo">Entrer</button>
    <div class="err" id="pwerr"></div>
  </div>
</div></div>
<header>
  <div class="hrow">
    <h1>Stock <small>Le Lido</small></h1>
    <div class="who"><span>Je suis</span><button data-w="Julien">Julien</button><button data-w="Dmytro">Dmytro</button><button data-w="Alix">Alix</button></div>
  </div>
  <input id="q" type="search" placeholder="Cherche : aperol, gambas, fût, purée…" autocomplete="off">
  <nav>
    <button data-tab="tout" class="on">🔎 Tout</button>
    <button data-tab="bar">🍹 Bar</button>
    <button data-tab="cui">🍳 Cuisine</button>
    <button data-tab="alert">⚠️ Alertes</button>
    <button data-tab="mv">✍️ Mouvements</button>
  </nav>
</header>
<main>
  <div class="banner" id="banner">Base partagée indisponible — consultation seule, les saisies ne seront pas enregistrées.</div>
  <div id="view"></div>
</main>
<button class="fab" id="fab">＋ Mouvement</button>
<dialog id="dlg">
  <h2 id="d_title">Nouveau mouvement</h2>
  <label>Produit *</label><select id="m_pid"></select>
  <label>Type</label><select id="m_type">
    <option value="inv">📋 Inventaire (stock compté — remplace l'ancien)</option>
    <option value="liv">🚚 Livraison reçue (+)</option>
    <option value="casse">💥 Casse / perte / offert (−)</option>
  </select>
  <label>Quantité * <span style="text-transform:none">(bouteilles / fûts pour le bar, kg·L·pièces pour la cuisine)</span></label>
  <input id="m_qte" type="number" step="any" inputmode="decimal" placeholder="ex : 12">
  <label>Entamé (bar, optionnel)</label><input id="m_ent" type="number" step="any" inputmode="decimal" placeholder="ex : 0,5 = demi-bouteille ouverte">
  <label>Note</label><input id="m_note" placeholder="ex : BL n°…, tombée en service…">
  <div class="dlgbtns"><button id="m_cancel">Annuler</button><button class="go" id="m_save">Enregistrer</button></div>
</dialog>

const fr=x=>{if(x==null||isNaN(x))return '—';const n=Math.round(x*100)/100;return (''+n).replace('.',',');};

/* ---------- calcul de l'état courant ---------- */
function calc(p){
  const ms=mvs.filter(m=>m.pid===p.id&&!m.rep).sort((a,b)=>(a.ts||0)-(b.ts||0));
  let d=p.d0, src=(p.zone==='bar'?'tableur pilotage du '+SEED.snapBar:'inventaire cuisine du '+SEED.snapCui);
  let counted=false;
  ms.forEach(m=>{
    const q=parseFloat(m.qte)||0, e=parseFloat(m.ent)||0;
    if(m.type==='inv'){ d=q+e; src='compté par '+(m.auteur||'?')+' le '+(m.date||'?'); counted=true; }
    else if(m.type==='liv') d+=q;
    else d-=q;
  });
  let st;
  if(!counted&&/à compter/.test(p.st0)) st='⚪ à compter';
  else if(d<0) st='🔴 négatif ?';
  else if(d===0) st='🔴 rupture';
  else if(p.zone==='bar'&&d<=p.seuil) st='🟠 réappro';
  else st='✅ OK';
  return {d,src,st,counted,nmv:ms.length};
}
function stChip(st){
  const cls=st.startsWith('🔴')?'urgent':(st.startsWith('🟠')?'warn':(st.startsWith('⚪')?'gold':'ok'));
  return '<span class="chip '+cls+'">'+st+'</span>';
}
function qcls(st){return st.startsWith('🔴')?'bad':(st.startsWith('🟠')||st.startsWith('⚪')?'warn':'ok');}

/* ---------- lignes ---------- */
function rowHtml(p){
  const c=calc(p);
  const unit=p.zone==='bar'?' bout.':(' '+p.unit);
  const mvsFor=mvs.filter(m=>m.pid===p.id).sort((a,b)=>(b.ts||0)-(a.ts||0));
  let det='';
  if(p.zone==='bar') det+=(p.fmt?esc(p.fmt)+' · ':'')+(p.prix?esc(p.prix)+' HT · ':'')+'seuil '+fr(p.seuil)+'<br>';
  if(p.note) det+=esc(p.note)+'<br>';
  if(p.st0&&p.zone==='cui') det+=esc(p.st0)+'<br>';
  det+='<div class="src">État : '+esc(c.src)+'</div>';
  det+='<div class="actbtns">'+
    '<button onclick="event.stopPropagation();openMv(\''+p.id+'\',\'inv\')">📋 Compter</button>'+
    '<button onclick="event.stopPropagation();openMv(\''+p.id+'\',\'liv\')">🚚 Livraison</button>'+
    '<button onclick="event.stopPropagation();openMv(\''+p.id+'\',\'casse\')">💥 Casse</button></div>';
  if(mvsFor.length) det+='<div class="notes">'+mvsFor.slice(0,6).map(mvLine).join('')+'</div>';
  return '<div class="row" tabindex="0" onclick="tg(this)"><div class="r1"><span class="pname">'+esc(p.nom)+'</span>'+
    '<span class="qty '+qcls(c.st)+'">'+fr(c.d)+unit+'</span></div>'+
    '<div class="r2">'+stChip(c.st)+'<span class="chip">'+esc(p.cat)+'</span>'+(p.f&&p.zone==='cui'?'<span>'+esc(p.f)+'</span>':'')+(c.nmv?'<span class="chip gold">✍️ '+c.nmv+'</span>':'')+'</div></div>'+
    '<div class="detail">'+det+'</div>';
}
function mvLine(m){
  const lbl={inv:'📋 compté',liv:'🚚 livraison +',casse:'💥 casse −'}[m.type]||m.type;
  return '<div class="note"><b>'+esc(m.auteur||'?')+' · '+esc(m.date||'')+(m.rep?' · reporté ✅':'')+'</b><br>'+lbl+' '+fr(parseFloat(m.qte))+(m.ent?' (+'+fr(parseFloat(m.ent))+' entamé)':'')+(m.note?' — '+esc(m.note):'')+'</div>';
}
window.tg=el=>{const d=el.nextElementSibling; if(d&&d.classList.contains('detail')) d.classList.toggle('open');};

let catSel={bar:'',cui:''};
window.setCat=(zone,cat)=>{catSel[zone]=cat;render();};
function grouped(list,zone){
  const g={},order=[];
  list.forEach(p=>{const k=p.cat||'Autre';if(!g[k]){g[k]=[];order.push(k);}g[k].push(p);});
  const sel=g[catSel[zone]]?catSel[zone]:'';
  let h='<div class="catbar"><button class="'+(sel===''?'on':'')+'" onclick="setCat(\''+zone+'\',\'\')">Tout<b>'+list.length+'</b></button>';
  order.forEach(k=>{h+='<button class="'+(sel===k?'on':'')+'" onclick="setCat(\''+zone+'\',\''+esc(k).replace(/'/g,"\\'")+'\')">'+esc(k)+'<b>'+g[k].length+'</b></button>';});
  h+='</div>';
  const keys=sel?[sel]:order;
  keys.forEach(k=>{h+='<div class="grouphead">'+esc(k)+' — '+g[k].length+'</div><div class="card">'+g[k].map(rowHtml).join('')+'</div>';});
  return h;
}
function alertList(){

  return {

    cpt:withC.filter(x=>x.c.st.startsWith('⚪'))
  };
}
function vTout(){
  const a=alertList(); const nrep=mvs.filter(m=>!m.rep).length;
  let h='<div class="statgrid">'+
  '<div class="stat"><b>'+SEED.items.filter(p=>p.zone==='bar').length+'</b><span>réfs bar (tableur '+SEED.snapBar+')</span></div>'+
  '<div class="stat"><b>'+SEED.items.filter(p=>p.zone==='cui').length+'</b><span>réfs cuisine ('+SEED.snapCui+')</span></div>'+

  h+='<div class="legend">Stock affiché = dernier état connu (tableur / inventaire) + vos saisies. « 📋 Compter » remplace le stock du produit. Julien reporte ensuite les mouvements dans le tableur maître et les marque « reporté ».</div>';
  if(a.rup.length)h+='<div class="grouphead">🔴 Ruptures / négatifs</div><div class="card">'+a.rup.map(x=>rowHtml(x.p)).join('')+'</div>';
  if(a.rea.length)h+='<div class="grouphead">🟠 Réappro (sous le seuil)</div><div class="card">'+a.rea.slice(0,40).map(x=>rowHtml(x.p)).join('')+'</div>';
  return h;
}
function vSearch(q){
  const toks=norm(q).split(/\s+/).filter(Boolean);
  const hit=p=>{const hay=norm([p.nom,p.cat,p.f,p.note,p.st0].join(' '));return toks.every(t=>hay.includes(t));};
  const bar=SEED.items.filter(p=>p.zone==='bar'&&hit(p)), cu=SEED.items.filter(p=>p.zone==='cui'&&hit(p));
  let h='';
  if(bar.length)h+='<div class="grouphead">🍹 Bar</div><div class="card">'+bar.slice(0,40).map(rowHtml).join('')+'</div>';
  if(cu.length)h+='<div class="grouphead">🍳 Cuisine</div><div class="card">'+cu.slice(0,40).map(rowHtml).join('')+'</div>';
  return h||'<div class="empty">Rien trouvé pour « '+esc(q)+' ».</div>';
}
function vAlert(){
  const a=alertList();
  let h='<div class="legend">Alertes recalculées en direct avec vos saisies. Seuils bar = tableur pilotage ; la cuisine n\'a pas encore de seuils.</div>';
  h+='<div class="grouphead">🔴 Ruptures / négatifs — '+a.rup.length+'</div><div class="card">'+(a.rup.map(x=>rowHtml(x.p)).join('')||'<div class="empty">Aucune 🎉</div>')+'</div>';
  h+='<div class="grouphead">🟠 Réappro — '+a.rea.length+'</div><div class="card">'+(a.rea.map(x=>rowHtml(x.p)).join('')||'<div class="empty">Aucune</div>')+'</div>';
  h+='<div class="grouphead">⚪ À compter — '+a.cpt.length+'</div><div class="card">'+(a.cpt.map(x=>rowHtml(x.p)).join('')||'<div class="empty">Tout est compté</div>')+'</div>';
  return h;
}
function vMv(){
  if(!mvs.length)return '<div class="empty">Aucun mouvement saisi.<br>Bouton ＋ en bas à droite : inventaire compté, livraison, casse — visible par toute l\'équipe en temps réel.</div>';
  const list=[...mvs].sort((a,b)=>(b.ts||0)-(a.ts||0));
  let h='<div class="legend">Tous les mouvements saisis par l\'équipe, les plus récents en premier. « Reporté » = intégré au tableur maître par Julien (le mouvement ne compte plus dans le calcul).</div><div class="card">';
  h+=list.map(m=>{
    const p=byId[m.pid];const lbl={inv:'📋 Inventaire',liv:'🚚 Livraison',casse:'💥 Casse'}[m.type]||m.type;
    return '<div class="mvrow'+(m.rep?' rep':'')+'"><div><b>'+esc(p?p.nom:m.pid)+'</b> — '+lbl+' '+fr(parseFloat(m.qte))+(m.ent?' (+'+fr(parseFloat(m.ent))+' ent.)':'')+

  }).join('');
  return h+'</div>';
}

    go.onclick=()=>{err.textContent='';
      firebase.auth().signInWithEmailAndPassword(TEAM_EMAIL,pw1.value)
        .then(()=>{pw1.value='';})
        .catch(()=>{err.textContent='Mot de passe incorrect.';});
    };
    pw1.addEventListener('keydown',e=>{if(e.key==='Enter')go.click();});
  }).catch(()=>{ msg.textContent='Hors ligne — impossible de joindre la base. Recharge quand tu as du réseau.'; });
})();
</script>
</body>
</html>
